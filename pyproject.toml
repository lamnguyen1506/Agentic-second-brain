[project]
name = "agentic-second-brain"
version = "0.1.0"
description = "Personal Knowledge Retriever - RAG system using Pydantic AI with memory, guardrails, and observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.0.0",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "anthropic>=0.42.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.19.0",
    "loguru>=0.7.0",
    "pydantic-evals>=0.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
